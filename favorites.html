<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites · Book Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/theme.js"></script>
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
<header id="site-nav"></header>

<main class="flex-1 max-w-6xl w-full mx-auto px-4 py-10">
    <h1 class="font-serif text-3xl font-bold mb-2">Your favorites</h1>
    <p id="fav-count" class="text-ink/70 italic mb-8 pb-2 border-b border-brass/40"></p>
    <div id="status" class="text-center py-12 empty:hidden" aria-live="polite"></div>
    <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
</main>

<footer id="site-footer"></footer>
<script type="module" src="js/favoritesPage.js"></script>
</body>
</html>
